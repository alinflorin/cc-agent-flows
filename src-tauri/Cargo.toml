[package]
name = "cc-agent-flows"
version = "0.6.5"
description = "CC Agent Flows desktop app"
authors = ["Alin-Florin Ciu"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_agent_flows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2.5.0"
serde_json = "1"
serde_yaml_ng = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "sync", "net", "process"] }
sha2 = "0.11.1"
base64 = "0.23.1"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
rand = { version = "0.10", features = ["thread_rng"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
webpki-roots = "1.0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri-plugin-notification = "2.8.0"

[dev-dependencies]
# generates src/generated/*.ts from protocol.rs (`cargo test export_bindings`)
ts-rs = { version = "12", features = ["serde-json-impl"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

# OS credential store for the Claude setup token
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
