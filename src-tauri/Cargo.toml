[package]
name = "cc-agent-flows"
version = "0.3.0"
description = "CC Agent Flows desktop app"
authors = ["Alin-Florin Ciu"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_agent_flows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2.5.0"
serde_json = "1"
async-nats = "0.51.0"
nkeys = "0.4.5"
base64 = "0.23.1"
futures = "0.3.34"
bytes = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
uuid = { version = "1.29.0", features = ["v4"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "form"] }
protocol = { path = "../crates/protocol" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

# OS credential store for the Claude setup token
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde_urlencoded = "0.7.1"

