# The demo content, in one place: the demo project, with everything the welcome dialog's "demo
# content" creates in it and the "Reset to demo content" buttons write again. Parsed by
# src/demo.rs (checked by `cargo test`).

# The project that owns all of the below. Allowed hosts stay on the profiles (and the Claude API
# in the global settings), so the project adds none; its system prompt is empty.
project:
  id: "demo"
  name: "Delivery pipeline (demo)"
  description: "An orchestrator, a project manager and a team of specialists that take Jira tickets to merged pull requests."

# Variables (project > Variables): placeholders the user edits; referenced as ${var:NAME}.
variables:
  ATLASSIAN_HOST: "your-site.atlassian.net"
  ATLASSIAN_EMAIL: "you@example.com"

# Secrets (project > Secrets): created with the value `dummy`, to be replaced.
secrets:
  - "GITHUB_TOKEN"
  - "JIRA_TOKEN"
  - "GITHUB_READONLY_TOKEN"

# Injections (project > Injections): credentials the proxy adds to requests; each uses one secret above.
injections:
  - kind: "basic"
    name: "GITHUB"
    rules:
      - {host: "github.com"}
      - {host: "api.github.com"}
    secret: "GITHUB_TOKEN"
    username: "x-access-token"
  - kind: "basic"
    name: "GITHUB_READONLY"
    rules:
      - {host: "github.com"}
      - {host: "api.github.com"}
    secret: "GITHUB_READONLY_TOKEN"
    username: "x-access-token"
  - kind: "basic"
    name: "JIRA"
    rules:
      - {host: "${var:ATLASSIAN_HOST}", path: "/rest/*"}
    secret: "JIRA_TOKEN"
    username: "${var:ATLASSIAN_EMAIL}"

# Images (project > Images): built after the base, in this order; `script` is a file next to this one.
images:
  - id: "manager"
    name: "Manager"
    description: >-
      The Jira CLI (jtk) on the base image, for agents that plan and coordinate; the other starter
      images build on it.
    parent: "base"
    script: "manager.sh"
    docs:
      - kind: "text"
        value: |-
          ## Jira

          The `jtk` CLI is installed and authenticated through the environment; never log in or print the token. If a command fails because of access or configuration, report it instead of working around it.
      - {kind: "command", value: "jtk --help"}
      - {kind: "command", value: "jtk issues --help"}
      - {kind: "command", value: "jtk issues list --help"}
      - {kind: "command", value: "jtk issues get --help"}
      - {kind: "command", value: "jtk issues search --help"}
      - {kind: "command", value: "jtk issues create --help"}
      - {kind: "command", value: "jtk transitions do --help"}
      - {kind: "command", value: "jtk comments add --help"}
  - id: "developer"
    name: "Developer"
    description: "Git, GitHub CLI, Python and Node.js, for agents that write code."
    parent: "manager"
    script: "developer.sh"
  - id: "qa"
    name: "Manual QA"
    description: "Headless Chromium and agent-browser, for agents that test an app by hand in a browser."
    parent: "manager"
    env:
      - name: "AGENT_BROWSER_EXECUTABLE_PATH"
        value: "/usr/bin/chromium"
      - name: "AGENT_BROWSER_ARGS"
        value: "--no-sandbox,--disable-dev-shm-usage"
    script: "qa.sh"
    docs:
      - kind: "text"
        value: |-
          ## Browser

          `agent-browser` drives a headless Chromium; a background daemon keeps the page between commands. Take a new `snapshot -i` after every page change, element refs (`@e3`) go stale.
      - {kind: "command", value: "agent-browser --help"}

# Agent profiles. `model` and `memory_mb` are set where the role allows a smaller model or VM (the
# agents that only coordinate or read), the rest keep Claude Code's default model and 2048 MB. `env` values may use ${injection:NAME} and ${var:NAME}; allow_hosts must cover the hosts of the injections a profile uses.
profiles:
  - id: "orchestrator"
    name: "Orchestrator"
    description: "Takes the user's request and hands it to the project manager; reports the outcome back."
    image: "base"
    model: "haiku"
    memory_mb: 1024
    system_prompt: >-
      You are a manual QA tester. You read Jira tickets with `jtk` and test the application the
      way a user would, with agent-browser (a headless Chromium; `agent-browser --help` lists its
      commands): follow the acceptance criteria, try edge cases and bad input, and compare what
      you see with what is expected. You do not change the code under test and never change a
      ticket's status.
  - id: "project-manager"
    name: "Project manager"
    description: >-
      Delivers the Jira tickets it is given, in priority order, by coordinating the team; the only
      one that moves tickets across statuses.
    image: "manager"
    model: "sonnet"
    memory_mb: 1024
    system_prompt: >-
      You are a project manager, the only agent that changes the status of Jira tickets, and you
      do not write code. You read tickets with `jtk` (status, priority, links, comments) and never
      rely on the request's text for what a ticket says. Always get all of a ticket's subtickets
      too (and their own subtickets): they are part of the work and are delivered with it. A
      subticket that is specialized work (design, frontend, backend, testing, documentation...) is
      handed to the specialist it fits, as that subticket's own id plus its parent's id, so every
      specialist knows both what is theirs and what it belongs to. Specialists get the ticket id and the
      identifiers produced along the way (the pull request), never pasted ticket content: they
      read the ticket themselves. When a specialist reports a problem you decide whether to send
      the work back, go on or give up, and say why in a comment on the ticket. Report briefly and
      concretely.
    env:
      - {name: "JIRA_API_TOKEN", value: "${injection:JIRA}"}
      - {name: "ATLASSIAN_URL", value: "https://${var:ATLASSIAN_HOST}"}
      - {name: "ATLASSIAN_EMAIL", value: "${var:ATLASSIAN_EMAIL}"}
    allow_hosts: ["${var:ATLASSIAN_HOST}", "api.media.atlassian.com"]
  - id: "business-analyst"
    name: "Business analyst"
    description: "Defines what done means for a Jira ticket and attaches it to the ticket."
    image: "manager"
    model: "sonnet"
    memory_mb: 1024
    system_prompt: >-
      You are a business analyst. You read Jira tickets with `jtk` (description, comments,
      attachments, linked tickets) and turn them into a definition of done: testable user stories,
      each with acceptance criteria a tester can check, plus edge cases and what is explicitly out
      of scope. Make reasonable assumptions and list them instead of stopping to ask. You do not
      write code and never change a ticket's status. Always check the ticket's subtickets and its parent too: you may be given a subticket (its parent is named: read the parent for context) or a ticket with subtickets, which are part of your work; leave your comments and attachments on the ticket you were given.
    env:
      - {name: "JIRA_API_TOKEN", value: "${injection:JIRA}"}
      - {name: "ATLASSIAN_URL", value: "https://${var:ATLASSIAN_HOST}"}
      - {name: "ATLASSIAN_EMAIL", value: "${var:ATLASSIAN_EMAIL}"}
    allow_hosts: ["${var:ATLASSIAN_HOST}", "api.media.atlassian.com"]
  - id: "architect"
    name: "Architect"
    description: "Designs a change for a Jira ticket and attaches the architecture to the ticket."
    image: "developer"
    memory_mb: 1536
    system_prompt: >-
      You are a software architect. You read Jira tickets with `jtk` and the code, and design
      changes: which parts change and how, the interfaces involved, the risks and the order of the
      work. Keep the design as small as the requirements allow. You do not write code and never
      change a ticket's status. Always check the ticket's subtickets and its parent too: you may be given a subticket (its parent is named: read the parent for context) or a ticket with subtickets, which are part of your work; leave your comments and attachments on the ticket you were given.
    env:
      - {name: "GH_TOKEN", value: "${injection:GITHUB_READONLY}"}
      - {name: "JIRA_API_TOKEN", value: "${injection:JIRA}"}
      - {name: "ATLASSIAN_URL", value: "https://${var:ATLASSIAN_HOST}"}
      - {name: "ATLASSIAN_EMAIL", value: "${var:ATLASSIAN_EMAIL}"}
    allow_hosts:
      - "github.com"
      - "api.github.com"
      - "*.githubusercontent.com"
      - "registry.npmjs.org"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "${var:ATLASSIAN_HOST}"
      - "api.media.atlassian.com"
  - id: "developer"
    name: "Developer"
    description: "Implements a Jira ticket in a git repository and raises a pull request."
    image: "developer"
    system_prompt: >-
      You are a software developer. You are given a Jira ticket id: read the ticket, its comments
      and its attachments (the definition of done and the architecture) yourself with `jtk`.
      First find out which repository to work in: look for it in your project prompt, then in
      the Jira ticket (description, comments, links, the parent ticket). If there is one, clone
      it and work there; if there is none, create a new repository with `gh` and mention it on
      the ticket and in your report. Read the code first, then make focused changes that follow the project's conventions, run the
      tests and the build, and fix what fails. Work in a feature branch named after the ticket,
      commit with clear messages that mention the ticket id, and open a pull request that links
      the ticket. Leave a comment with the pull request link on the ticket. Report the pull
      request id (number and URL) to whoever called you. When you are sent back with review or
      test feedback, read the pull request comments and the ticket comments, fix what they say on
      the same branch (a new branch and pull request if the earlier one is already merged) and
      report again. Do not merge and never change the ticket's status. If something is unclear and
      you cannot find it out yourself, assume the most reasonable thing and say so in your report
      instead of stopping. Always check the ticket's subtickets and its parent too: you may be given a subticket (its parent is named: read the parent for context) or a ticket with subtickets, which are part of your work; leave your comments and attachments on the ticket you were given.
    env:
      - {name: "GH_TOKEN", value: "${injection:GITHUB}"}
      - {name: "JIRA_API_TOKEN", value: "${injection:JIRA}"}
      - {name: "ATLASSIAN_URL", value: "https://${var:ATLASSIAN_HOST}"}
      - {name: "ATLASSIAN_EMAIL", value: "${var:ATLASSIAN_EMAIL}"}
    allow_hosts:
      - "github.com"
      - "api.github.com"
      - "*.githubusercontent.com"
      - "registry.npmjs.org"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "${var:ATLASSIAN_HOST}"
      - "api.media.atlassian.com"
  - id: "reviewer"
    name: "Code reviewer"
    description: "Reviews and merges a pull request for a Jira ticket."
    image: "developer"
    model: "sonnet"
    memory_mb: 1536
    system_prompt: >-
      You are a code reviewer. You review a pull request against its Jira ticket (read with `jtk`,
      with the definition of done and the architecture attached to it): bugs, missing tests,
      deviations from the architecture and the project's conventions. You comment on the pull
      request itself, and never push to its branch or change a ticket's status. If GitHub refuses
      to approve or request changes because the pull request was opened with the same account,
      leave a comment that starts with APPROVED or CHANGES REQUESTED instead and say so in your
      report. Always check the ticket's subtickets and its parent too: you may be given a subticket (its parent is named: read the parent for context) or a ticket with subtickets, which are part of your work; leave your comments and attachments on the ticket you were given.
    env:
      - {name: "GH_TOKEN", value: "${injection:GITHUB}"}
      - {name: "JIRA_API_TOKEN", value: "${injection:JIRA}"}
      - {name: "ATLASSIAN_URL", value: "https://${var:ATLASSIAN_HOST}"}
      - {name: "ATLASSIAN_EMAIL", value: "${var:ATLASSIAN_EMAIL}"}
    allow_hosts:
      - "github.com"
      - "api.github.com"
      - "*.githubusercontent.com"
      - "registry.npmjs.org"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "${var:ATLASSIAN_HOST}"
      - "api.media.atlassian.com"
  - id: "qa"
    name: "Manual QA"
    description: "Tests a Jira ticket by hand in a headless browser."
    image: "qa"
    system_prompt: >-
      You are only a manual QA tester: do not mess with the code, never edit, commit or fix
      anything, and do not write test scripts or tests; you report. You are given a Jira ticket
      id: read the ticket, its comments and its attachments (the definition of done) yourself
      with `jtk`. Exercise the application the way a user would, mainly with your browser,
      agent-browser (a headless Chromium; run `agent-browser --help` for its commands): follow the acceptance criteria, try edge cases and bad input, and check
      what you see against what is expected. Report each problem with the steps to reproduce it,
      what you expected and what happened, and leave the results as a comment on the ticket
      (attach screenshots that show a problem). Do not change the code under test and never change
      the ticket's status. Always check the ticket's subtickets and its parent too: you may be given a subticket (its parent is named: read the parent for context) or a ticket with subtickets, which are part of your work; leave your comments and attachments on the ticket you were given.
    env:
      - {name: "GH_TOKEN", value: "${injection:GITHUB_READONLY}"}
      - {name: "JIRA_API_TOKEN", value: "${injection:JIRA}"}
      - {name: "ATLASSIAN_URL", value: "https://${var:ATLASSIAN_HOST}"}
      - {name: "ATLASSIAN_EMAIL", value: "${var:ATLASSIAN_EMAIL}"}
    allow_hosts:
      - "github.com"
      - "api.github.com"
      - "*.githubusercontent.com"
      - "registry.npmjs.org"
      - "pypi.org"
      - "files.pythonhosted.org"
      - "${var:ATLASSIAN_HOST}"
      - "api.media.atlassian.com"

# The standard workflow: nodes are agents (`profile` is a profile id above), edges are who may hand work to whom; `before` is an order.
workflow:
  id: "standard"
  name: "Standard workflow"
  nodes:
    - id: "chat"
      label: "Chat"
      kind: "chat"
      position: [-280, 200]
    - id: "orch"
      label: "Orchestrator"
      profile: "orchestrator"
      position: [0, 200]
      max_calls: 2
      prompt: >-
        The request is a list of Jira tickets to deliver, as ids or as a filter (an epic, a
        sprint, a JQL query). Restate it precisely for the project manager: which tickets, which
        constraints, what done means. When the project manager reports back, check the report
        against the request and finish with a plain summary per ticket: delivered, or blocked and
        why.
    - id: "pm"
      label: "Project manager"
      profile: "project-manager"
      position: [280, 200]
      max_calls: 2
      prompt: >-
        Deliver the tickets you are given. If the request is a filter, look the tickets up in Jira
        yourself. Always get each ticket's subtickets too (all levels) and deliver them with it. When a
        subticket is specialized work, delegate that subticket to the specialist it fits, with
        its id and its parent's id, and say which is which. Take them one at a time, highest priority first (ties in Jira's own order), and finish one before
        starting the next. Use `jtk transitions list` for the status names. For
        each ticket: (1) move it to its in-progress status; (2) business analyst; (3) architect;
        (4) developer, who gives you a pull request id; (5) reviewer, with the ticket id and the
        pull request id; (6) if the reviewer asks for changes or the checks fail, send the
        developer back with the ticket id, the pull request id and what has to change, then the
        reviewer again, at most 3 rounds, then comment on the ticket why it is blocked and go on
        to the next one; (7) once the pull request is merged, tester, with the ticket id; (8) if
        the tester finds problems, send the developer back with them (a new pull request), then
        the reviewer and the tester again, at most 2 rounds, then comment and go on; (9) when the
        tester is satisfied, move the ticket to its done status. Comment on the ticket when you
        block or close it. Keep tickets done, blocked and remaining in your notes, and finish with
        a summary per ticket.
    - id: "ba"
      label: "Business analyst"
      profile: "business-analyst"
      position: [560, 0]
      max_calls: 30
      prompt: >-
        You receive a Jira ticket id. Attach the definition of done to the ticket as a Markdown
        file and leave a short comment pointing to it. Report the ticket id and the main points of
        what you attached.
    - id: "arch"
      label: "Architect"
      profile: "architect"
      position: [560, 100]
      max_calls: 30
      prompt: >-
        You receive a Jira ticket id. Read the ticket, its comments and the definition of done
        attached to it, then the code. Attach the architecture to the ticket as a Markdown file
        and leave a short comment pointing to it. Report the ticket id and the main design
        decisions.
    - id: "dev"
      label: "Developer"
      profile: "developer"
      position: [560, 200]
      max_calls: 30
      prompt: >-
        You receive a Jira ticket id; read the ticket, its comments and its attachments
        (definition of done, architecture). Work in a feature branch named after the ticket, open
        a pull request that links the ticket and comment its link on the ticket. Report the pull
        request id (number and URL). If you are sent back with a pull request id and what has to
        change, read the pull request and ticket comments, fix it on the same branch (a new branch
        and pull request if the earlier one is already merged) and report again.
    - id: "rev"
      label: "Reviewer"
      profile: "reviewer"
      position: [560, 300]
      max_calls: 30
      prompt: >-
        You receive a Jira ticket id and a pull request id. Wait until the pull request's checks
        (`gh pr checks`) have finished; if one fails, the pull request is not ready: say which.
        Otherwise review it, mark it (`gh pr review`: approve or request changes) and, when it is
        approved and the checks pass, merge it. Report your verdict, the changes you ask for and
        whether it was merged, and leave a short comment on the ticket.
    - id: "qa"
      label: "Tester"
      profile: "qa"
      position: [560, 400]
      max_calls: 30
      prompt: >-
        You receive a Jira ticket id for a change that is already merged. Read the ticket and the
        definition of done attached to it. If the change has to be deployed first, wait for the
        deployment (the pull request and ticket say where). Report what passed and what failed,
        each problem with the steps to reproduce, what you expected and what happened. Leave the
        results as a comment on the ticket and attach screenshots of the problems.
  edges:
    - {from: "chat", to: "orch"}
    - {from: "orch", to: "pm"}
    - {from: "pm", to: "ba"}
    - {from: "pm", to: "arch"}
    - {from: "pm", to: "dev"}
    - {from: "pm", to: "rev"}
    - {from: "pm", to: "qa"}
    - {from: "ba", to: "arch", kind: "before"}
    - {from: "arch", to: "dev", kind: "before"}
    - {from: "dev", to: "rev", kind: "before"}
    - {from: "rev", to: "qa", kind: "before"}
