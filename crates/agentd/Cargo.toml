[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
description = "Runs one Claude Code task inside an agent VM and reports to the app"

[dependencies]
protocol = { path = "../protocol" }
async-nats = { version = "0.51.0", default-features = false, features = ["ring", "jetstream", "nkeys", "crypto", "server_2_10"] }
nkeys = "0.4.5"
base64 = "0.23.1"
futures = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process", "fs", "sync"] }
libc = "0.2"
