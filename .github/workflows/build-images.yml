name: Build agent images

# Builds the base Alpine image (Claude Code and agentd preinstalled) natively on x86_64 and arm64
# runners and publishes it to a rolling prerelease, image-base-p<protocol>, replacing the previous
# assets. <protocol> is the agent protocol number in scripts/images/version.json: the app downloads
# the image for the protocol it speaks, so an older or newer app never gets an agentd it cannot
# talk to. Bump it on every protocol change that breaks old messages. Profiles (developer and the
# like) are not built here: the app applies them on top of this image on the user's machine.
# Push to main (or run manually) to rebuild.
on:
  push:
    branches: [main]
    paths:
      - scripts/images/**
      - crates/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

jobs:
  # agentd goes into every image: a static musl binary per arch, built natively on the same runner
  # types as the images, from the same commit.
  agentd:
    strategy:
      matrix:
        include:
          - { platform: ubuntu-22.04, arch: x86_64 }
          - { platform: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Same cached .debs as the image job, so no apt-get update on a hit
      - name: Install musl-tools
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools
          version: 1
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo build --release --manifest-path crates/Cargo.toml -p agentd --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Check it is static
        run: |
          bin=crates/target/${{ matrix.arch }}-unknown-linux-musl/release/agentd
          file "$bin" | grep -q 'statically linked\|static-pie'
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: agentd-${{ matrix.arch }}
          path: crates/target/${{ matrix.arch }}-unknown-linux-musl/release/agentd

  build:
    needs: agentd
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu-22.04, arch: x86_64 }
          - { platform: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Restores the .debs from the Actions cache and skips apt-get update on a hit, which is where
      # the job used to hang
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: qemu-utils rsync dosfstools fdisk e2fsprogs jq
          version: 1

      - uses: actions/download-artifact@v4
        with:
          name: agentd-${{ matrix.arch }}
          path: agentd-in

      - name: Build image
        # The bootstrap downloads apk-tools from gitlab.alpinelinux.org, which times out now and then
        run: |
          chmod +x agentd-in/agentd
          for attempt in 1 2 3; do
            scripts/images/build.sh "${{ matrix.arch }}" image-out agentd-in/agentd && exit 0
            echo "build attempt $attempt failed" >&2
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: agent-base-${{ matrix.arch }}
          path: image-out/agent-base-${{ matrix.arch }}.qcow2

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A prerelease, so it never becomes /releases/latest, which the app's updater points at.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          protocol=$(jq -r .protocol scripts/images/version.json)
          tag="image-base-p$protocol"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --prerelease --latest=false --title "Base agent image (protocol $protocol)" \
            --notes "Latest Alpine base image with Claude Code and agentd for agent protocol $protocol, for x86_64 and aarch64; replaced on every build. The app downloads it and builds profiles on top of it. Not an app release."
          gh release upload "$tag" dist/agent-base-*.qcow2 --clobber
