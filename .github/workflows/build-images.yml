name: Build agent images

# Builds the Alpine images (Claude Code preinstalled) the app boots agents from, one per profile in
# scripts/images/profiles/, natively on x86_64 and arm64 runners. Each profile is published to its
# own rolling prerelease, image-<profile>-p<protocol>, replacing the previous assets. <protocol> is
# the agent protocol number in scripts/images/version.json: the app downloads the image for the
# protocol it speaks, so an older or newer app never gets an agentd it cannot talk to. Bump it on
# every protocol change that breaks old messages. Only the latest image per profile and protocol is
# kept. Add a profile: create its JSON file and add it to the matrix below. Push to
# main (or run manually) to rebuild.
on:
  push:
    branches: [main]
    paths:
      - scripts/images/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: base, platform: ubuntu-22.04, arch: x86_64 }
          - { profile: base, platform: ubuntu-24.04-arm, arch: aarch64 }
          - { profile: developer, platform: ubuntu-22.04, arch: x86_64 }
          - { profile: developer, platform: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Restores the .debs from the Actions cache and skips apt-get update on a hit, which is where
      # the job used to hang
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: qemu-utils rsync dosfstools fdisk e2fsprogs jq
          version: 1

      - name: Build image
        # The bootstrap downloads apk-tools from gitlab.alpinelinux.org, which times out now and then
        run: |
          for attempt in 1 2 3; do
            scripts/images/build.sh "${{ matrix.arch }}" image-out "${{ matrix.profile }}" && exit 0
            echo "build attempt $attempt failed" >&2
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.profile }}-${{ matrix.arch }}
          path: image-out/agent-${{ matrix.profile }}-${{ matrix.arch }}.qcow2

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A prerelease, so it never becomes /releases/latest, which the app's updater points at.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          protocol=$(jq -r .protocol scripts/images/version.json)
          for cfg in scripts/images/profiles/*.json; do
            profile=$(basename "$cfg" .json)
            tag="image-$profile-p$protocol"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
              --prerelease --latest=false --title "Agent image: $profile (protocol $protocol)" \
              --notes "Latest Alpine $profile image with Claude Code for agent protocol $protocol, for x86_64 and aarch64; replaced on every build. Used by the app; not an app release."
            gh release upload "$tag" dist/agent-"$profile"-*.qcow2 --clobber
          done
