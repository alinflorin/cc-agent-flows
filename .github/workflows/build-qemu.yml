name: Build QEMU

# Compiles QEMU from source for every desktop target and publishes it as a prerelease named
# qemu-<version>. release.yml downloads these instead of rebuilding. Bump scripts/qemu/version.json
# and push to main (or run manually) to produce a new one.
on:
  push:
    branches: [main]
    paths:
      - scripts/qemu/version.json
      - scripts/qemu/build.sh
      - .github/workflows/build-qemu.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - platform: macos-latest
            triple: aarch64-apple-darwin
          - platform: macos-15-intel
            triple: x86_64-apple-darwin
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned version
        id: pin
        shell: bash
        run: |
          echo "version=$(jq -r .version scripts/qemu/version.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 scripts/qemu/version.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: qemu-out
          key: qemu-${{ steps.pin.outputs.version }}-${{ matrix.triple }}-${{ hashFiles('scripts/qemu/build.sh') }}

      - name: Install Linux dependencies
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-venv libglib2.0-dev libpixman-1-dev \
            libslirp-dev libfdt-dev patchelf

      - name: Install macOS dependencies
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ninja pkgconf glib pixman libslirp dtc dylibbundler

      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            curl tar xz git
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-ninja mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-glib2 mingw-w64-x86_64-pixman

      - name: Build QEMU (Unix)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: scripts/qemu/build.sh "${{ steps.pin.outputs.version }}" "${{ steps.pin.outputs.sha256 }}" qemu-out

      - name: Build QEMU (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/qemu/build.sh "${{ steps.pin.outputs.version }}" "${{ steps.pin.outputs.sha256 }}" qemu-out

      - name: Package
        shell: bash
        run: tar -czf "qemu-${{ matrix.triple }}.tar.gz" -C qemu-out .

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.triple }}
          path: qemu-${{ matrix.triple }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A prerelease, so it never becomes /releases/latest, which the app's updater points at.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version scripts/qemu/version.json)
          tag="qemu-$version"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --prerelease --latest=false --title "QEMU $version" \
            --notes "QEMU $version built from https://download.qemu.org/qemu-$version.tar.xz (GPL-2.0). Used by the app; not an app release."
          gh release upload "$tag" dist/*.tar.gz --clobber
