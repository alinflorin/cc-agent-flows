name: Plain images (temporary)
on:
  push:
    paths: [".github/workflows/plain-images.yml", "scripts/images/build-plain.sh"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y qemu-utils e2fsprogs
      - run: sudo scripts/images/build-plain.sh ${{ matrix.arch }} "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: plain-${{ matrix.arch }}
          path: out/alpine-${{ matrix.arch }}.qcow2
